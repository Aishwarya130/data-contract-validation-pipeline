[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-contract-pipeline"
version = "1.0.0"
description = "A reproducible local data contract validation and ETL pipeline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0", "PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
contract-pipeline = "contract_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
